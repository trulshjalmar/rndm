<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roulette</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="left-controls-container">
        <button id="menu-btn" title="Settings" aria-label="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
            </svg>
        </button>
    </div>

    <div id="settings-panel">
        <div class="settings-group">
            <div class="button-row">
                <button class="pill-btn active" data-service="imgur">Imgur</button>
                <button class="pill-btn" data-service="catbox">Catbox</button>
            </div>
        </div>
        <div class="settings-group" id="imgur-options">
            <div class="button-row">
                <button class="format-btn active" data-format="5">5 Chars</button>
                <button class="format-btn" data-format="7">7 Chars</button>
            </div>
        </div>
    </div>

    <div id="right-controls-container">
        <span id="counter" title="Total images found">0</span>
        <button id="stats-btn" title="Toggle Stats" aria-label="Toggle Stats">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
            </svg>
        </button>
    </div>

    <div id="stats-panel">
        <div>Guesses: <span id="stat-req" class="highlight">0</span></div>
        <div>Dead links: <span id="stat-dead" class="highlight">0</span></div>
        <div>Hit-rate: <span id="stat-rate" class="highlight">0.00</span>%</div>
    </div>

    <img id="display-image" src="" alt="Random screenshot">
    
    <div class="nav-group">
        <div class="action-group-left">
            <button id="scale-btn" class="icon-btn side-btn" aria-label="Scale image">
                <svg id="scale-expand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
                <svg id="scale-contract" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                </svg>
            </button>
        </div>

        <button id="back-btn" class="icon-btn side-btn disabled" aria-label="Previous image">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/>
            </svg>
        </button>

        <button id="refresh-btn" class="icon-btn" aria-label="Get new image">
            <svg id="reload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            <svg id="bubbles-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <circle cx="12" cy="3" r="3" />
                <circle cx="19.5" cy="7.5" r="2.5" />
                <circle cx="19.5" cy="16.5" r="2" />
                <circle cx="12" cy="21" r="1.5" />
                <circle cx="4.5" cy="16.5" r="1" />
                <circle cx="4.5" cy="7.5" r="0.5" />
            </svg>
        </button>

        <button id="forward-btn" class="icon-btn side-btn disabled" aria-label="Next saved image">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
            </svg>
        </button>

        <div class="action-group-right">
            <button id="copy-btn" class="icon-btn side-btn" aria-label="Copy link">
                <svg id="copy-default" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
                <svg id="copy-success" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
