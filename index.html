<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightshot Roulette</title>
    <style>
        body {
            background-color: #121212;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        #display-image {
            max-width: 90vw;
            max-height: 75vh;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            display: none;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        #refresh-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 15px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #refresh-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        #refresh-btn:active {
            transform: scale(0.95);
        }

        #refresh-btn svg {
            width: 32px;
            height: 32px;
            fill: #777777;
            transition: fill 0.3s ease;
        }

        #refresh-btn:hover svg {
            fill: #ffffff;
        }

        .loading svg {
            animation: spin 1s linear infinite;
            fill: #ffffff !important;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <img id="display-image" src="" alt="">
        <button id="refresh-btn" aria-label="Neste bilde">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2.75a9.25 9.25 0 1 0 4.737 17.197l-1.393-2.393A6.75 6.75 0 1 1 18.75 12h-2.5l3.875-4.625L24 12h-2.75a9.25 9.25 0 0 0-9.25-9.25z"/>
            </svg>
        </button>
    </div>

    <script>
        const imgElement = document.getElementById('display-image');
        const btnElement = document.getElementById('refresh-btn');

        // Oppdatert liste med stabile raw-proxyer
        const proxies = [
            (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
            (url) => `https://corsproxy.org/?${encodeURIComponent(url)}`,
            (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];
        
        let currentProxyIndex = 0;

        function generateRandomId() {
            const letters = 'abcdefghijklmnopqrstuvwxyz';
            const numbers = '0123456789';
            let result = '';
            for (let i = 0; i < 2; i++) result += letters.charAt(Math.floor(Math.random() * letters.length));
            for (let i = 0; i < 4; i++) result += numbers.charAt(Math.floor(Math.random() * numbers.length));
            return result;
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function fetchRandomImage() {
            let validImageFound = false;

            while (!validImageFound) {
                const id = generateRandomId();
                // Har fjernet ?cb for å ikke trigge Cloudflare's spamfilter, og for å la proxyene cache døde lenker
                const targetUrl = `https://prnt.sc/${id}`; 
                
                let htmlText = null;
                let proxyWorkedNormally = false;

                try {
                    const proxyUrl = proxies[currentProxyIndex](targetUrl);
                    const res = await fetch(proxyUrl);

                    // Hvis proxyen blokkerer oss eller er nede, bytter vi proxy
                    if (res.status === 429 || res.status === 403 || res.status >= 500) {
                        currentProxyIndex = (currentProxyIndex + 1) % proxies.length;
                        throw new Error(`Proxy avvist med status ${res.status}`);
                    }

                    // Hvis alt gikk bra (200 OK)
                    if (res.ok) {
                        htmlText = await res.text();
                        proxyWorkedNormally = true;
                    } 
                    // Hvis Lightshot sier bildet er borte (404), vitner det om at proxyen fungerer, 
                    // men at ID-en er feil. Da trenger vi ikke bytte proxy.
                    else if (res.status === 404) {
                        proxyWorkedNormally = true;
                    }

                } catch (error) {
                    // Fanger opp CORS-brudd eller nettverksfeil og bytter proxy
                    currentProxyIndex = (currentProxyIndex + 1) % proxies.length;
                }

                // Hvis vi ikke fikk HTML (fordi ID var 404 eller proxy feilet), start loopen på nytt med ny ID
                if (!proxyWorkedNormally || !htmlText) {
                    await sleep(300); // Kort pause for å unngå å bli flagget som bot
                    continue;
                }

                // Parse HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                let imgUrl = null;
                const metaImage = doc.querySelector('meta[property="og:image"]');
                const imgTag = doc.getElementById('screenshot-image');

                if (metaImage && metaImage.content) {
                    imgUrl = metaImage.content;
                } else if (imgTag && imgTag.src) {
                    imgUrl = imgTag.src;
                }

                // Filtrer ut Lightshots placeholders for slettede bilder
                if (!imgUrl || imgUrl.includes('st.prntscr.com') || imgUrl.startsWith('//st.prntscr.com')) {
                    await sleep(300);
                    continue;
                }

                try {
                    await preloadImage(imgUrl);
                    imgElement.src = imgUrl;
                    imgElement.style.display = 'block';
                    imgElement.style.opacity = '1';
                    validImageFound = true;
                } catch (e) {
                    // Hvis selve Imgur-lenken er død (selv om Lightshot tror den eksisterer)
                    await sleep(300);
                }
            }
        }

        function preloadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = resolve;
                img.onerror = reject;
                img.src = url;
            });
        }

        btnElement.addEventListener('click', async () => {
            btnElement.classList.add('loading');
            imgElement.style.opacity = '0.4';
            await fetchRandomImage();
            btnElement.classList.remove('loading');
        });

        window.onload = async () => {
            btnElement.classList.add('loading');
            await fetchRandomImage();
            btnElement.classList.remove('loading');
        };
    </script>
</body>
</html>
